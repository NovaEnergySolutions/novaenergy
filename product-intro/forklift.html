<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet"><title>지게차용 리튬배터리 | NOVA ENERGY</title>
<style>
:root{--n:#0d3432;--m:#c9d99e;--g:#e7c7a3;--l:#dce5e2;--i:#172322;--u:#667472}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--i);background:#f5f8f7;line-height:1.6}.wrap{width:min(1180px,100%);margin:auto}.hero{padding:72px 24px 64px;background:linear-gradient(135deg,var(--n),#092927);color:#fff}.tag{display:inline-flex;padding:7px 16px;border-radius:999px;background:var(--m);color:#17322e;font-weight:800}h1{margin:22px 0 16px;font-size:clamp(34px,5vw,62px);line-height:1.15;letter-spacing:-.04em}.lead{max-width:780px;margin:0;color:#d9e6e3;font-size:clamp(17px,2vw,21px)}.stats,.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stats{margin-top:38px}.stat{padding:23px 20px;border:1px solid #ffffff2e;border-radius:18px;background:#ffffff12}.stat strong{display:block;color:var(--g);font-size:23px}.stat span{font-size:14px;color:#d9e6e3}main{padding:56px 24px 80px}h2{margin:0 0 10px;font-size:clamp(27px,4vw,40px);letter-spacing:-.035em}.sub{margin:0 0 28px;color:var(--u)}.benefits{margin-bottom:64px}.card{padding:25px;border:1px solid var(--l);border-radius:20px;background:#fff;box-shadow:0 10px 30px #0d34320f}.icon{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#e7f0ee;color:var(--n);font-size:22px;font-weight:900}.card h3{margin:16px 0 7px}.card p{margin:0;color:var(--u);font-size:15px}.spec-head{display:flex;align-items:end;justify-content:space-between;gap:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:9px 17px;border:1px solid #b9c9c6;border-radius:999px;background:#fff;font-weight:800;cursor:pointer}.tab.active{border-color:var(--n);background:var(--n);color:#fff}.tablebox{margin-top:18px;overflow-x:auto;border:1px solid var(--l);border-radius:18px;background:#fff;box-shadow:0 10px 30px #0d34320d}table{width:100%;min-width:1080px;border-collapse:collapse;text-align:center;font-size:14px}th{padding:14px 10px;background:var(--n);color:#fff;white-space:nowrap}td{padding:12px 10px;border-bottom:1px solid #e4ebe9}tbody tr:hover{background:#f0f6f4}.chem{font-weight:900;color:var(--n)}.notes{margin-top:20px;padding:18px 20px;border-radius:14px;background:#eaf1ef;color:#43524f;font-size:14px}.notes p{margin:3px 0}.cta{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:50px;padding:34px;border-radius:24px;background:var(--n);color:#fff}.cta h2{font-size:28px}.cta p{margin:5px 0 0;color:#d7e4e1}.cta a{padding:13px 22px;border-radius:999px;background:var(--m);color:#16342f;text-decoration:none;font-weight:900;white-space:nowrap}@media(max-width:850px){.stats,.benefits{grid-template-columns:repeat(2,1fr)}.spec-head,.cta{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.hero{padding-top:48px}.stats,.benefits{grid-template-columns:1fr}.tab{flex:1}.cta a{width:100%;text-align:center}}
/* NOVA ENERGY navy theme */
:root{--n:#0B1F3A;--m:#C7DDF2;--g:#E8C48A;--l:#D9E3EE;--i:#142033;--u:#607086}
body{background:#F5F8FC}.hero{background:linear-gradient(135deg,#0B1F3A,#163A63)}.tag{background:#C7DDF2;color:#0B1F3A}.lead,.stat span{color:#DDE9F5}.card{box-shadow:0 10px 30px #0B1F3A12}.icon,.notes{background:#E8F1FA}.tab{border-color:#B8C9DA}.tablebox{box-shadow:0 10px 30px #0B1F3A0F}td{border-bottom-color:#E2EAF2}tbody tr:hover{background:#F0F5FB}.notes{color:#40536B}.cta p{color:#DCE8F4}.cta a{background:#C7DDF2;color:#0B1F3A}
#body tr.ncm-start td{border-top:4px solid #163A63}
.product-visual{margin:0 0 48px}.product-visual img{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 16px 44px #0B1F3A20}@media(max-width:520px){.product-visual{margin-bottom:32px}.product-visual img{border-radius:12px}}
</style></head><body>
<main><div class="wrap"><div class="product-visual"><img src="../images/product-intro/forklift.png" alt="노바에너지 전동지게차용 리튬배터리 홍보 이미지"></div>
<section><div class="spec-head"><div><h2>전동지게차 배터리 시스템 규격</h2><p class="sub">배터리 종류와 전압을 선택해 모델을 확인하세요.</p></div><div class="tabs"><button class="tab active" data-kind="all">전체</button><button class="tab" data-kind="LFP">LFP</button><button class="tab" data-kind="NCM">NCM</button><button class="tab volt" data-v="48">48V</button><button class="tab volt" data-v="72">72V</button></div></div><div class="tablebox"><table><thead><tr><th>제품군</th><th>배터리 종류</th><th>MODEL</th><th>브랜드</th><th>전압(V)</th><th>용량(Ah)</th><th>납산 환산(Ah)</th><th>에너지(Wh)</th><th>일반 사용(h)*</th><th>연속 사용(h)*</th><th>충전 수명*</th><th>사용 연수*</th></tr></thead><tbody id="body"></tbody></table></div><div class="notes"><p>* 사용시간, 충전 수명 및 사용 연수는 장비 부하, 운전 방식, 충전 조건, 온도와 관리 상태에 따라 달라질 수 있습니다.</p><p>* 실제 적용 전 장비 전압, 설치 공간, 커넥터, 충전기 및 요구 출력을 확인해야 합니다.</p></div></section>
</div></main>
<script>
const caps=[90,100,120,150,170,200,230,280,300],brandsN=['SAMSUNG','SAMSUNG','SAMSUNG','CATL','CALB','CATL','CATL','CATL','CATL'],brandsL=Array(9).fill('CATL');
const times={LFP:{48:[[7,5],[8,5.5],[9,6],[10,6.5],[11,7],[13,8],[14,8.5],[17,10],[19,11]],72:[[9,6],[10,6.5],[12,7.5],[14,8.5],[16,9.5],[18,10.5],[20,11.5],[23,13],[25,14]]},NCM:{48:[[7,5],[8,5.5],[9,6],[10,6.5],[11,7],[13,8],[14,8.5],[17,10],[19,11]],72:[[10,6.5],[10,6.5],[12,7.5],[14,8.5],[16,9.5],[18,10.5],[20,11.5],[23,13],[25,14]]}};
let rows=[];['LFP','NCM'].forEach(k=>[48,72].forEach(v=>caps.forEach((a,i)=>rows.push(['전동지게차',k,`NE-${v}${a}`,k==='LFP'?brandsL[i]:brandsN[i],v,a,a*1.5,v*a,...times[k][v][i]]))));let kind='all',volt='all';const b=document.querySelector('#body'),fmt=n=>Number.isInteger(n)?n:n.toFixed(1);function render(){const filtered=rows.filter(r=>(kind==='all'||r[1]===kind)&&(volt==='all'||r[4]===volt));b.innerHTML=filtered.map((r,i)=>`<tr class="${r[1]==='NCM'&&(i===0||filtered[i-1][1]!=='NCM')?'ncm-start':''}"><td>${r[0]}</td><td class="chem">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${fmt(r[6])}</td><td>${r[7].toLocaleString()}</td><td>${fmt(r[8])}</td><td>${fmt(r[9])}</td><td>6,000회 이상</td><td>10년 이상</td></tr>`).join('')}
document.querySelectorAll('[data-kind]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-kind]').forEach(y=>y.classList.remove('active'));x.classList.add('active');kind=x.dataset.kind;render()});document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{if(x.classList.contains('active')){x.classList.remove('active');volt='all'}else{document.querySelectorAll('[data-v]').forEach(y=>y.classList.remove('active'));x.classList.add('active');volt=+x.dataset.v}render()});render();
</script></body></html>
